<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='novo.css') }}">
</head>
<body>
<header>
    <h1>BIBLIOTECA</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash_messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</header>
  <h2>Adicionar Livro</h2>
    <form action="/criar" method="post" enctype="multipart/form-data">
        <label for="imagem">Capa do Livro:</label>
        <input type="file" id="imagem" name="imagem" accept=".jpg">

        <label>TÍTULO</label>
        <input type="text" id="titulo" name="titulo" required>

        <label>Autor</label>
        <input type="text" id="autor " name="autor" required>

        <label>Ano de Publicação</label>
        <input type="number" id="ano_publicacao " name="ano_publicacao" required>


          <button type="submit" class="bnt">Salvar</button>



    </form>


</body>
</html>
