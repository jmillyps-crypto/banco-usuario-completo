<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar</title>
</head>
<body>
<header>
    <h1>BIBLIOTECA</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash_messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</header>
  <h2>Editar Livro</h2>
    <form action="{{ url_for('editar', id=livro[0]) }}" method="post">

        <label>TÍTULO</label>
        <input type="text" id="titulo" name="titulo" value="{{ livro[1] }}"  required>

        <label>Autor</label>
        <input type="text" id="autor " name="autor" value="{{ livro[2] }}"  required>

        <label>Ano de Publicação</label>
        <input type="number" id="ano_publicacao " name="ano_publicacao" value="{{ livro[3] }}"  required>


          <button type="submit" class="bnt">Salvar</button>



    </form>


</body>
</html>
