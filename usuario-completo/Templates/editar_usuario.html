<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar</title>
</head>
<body>
<header>
    <h1>BIBLIOTECA</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash_messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</header>
  <h2>Editar Usuário</h2>
    <form action="{{ url_for('editar_usuario', id=usuario[0]) }}" method="post">

        <label>Nome</label>
        <input type="text" id="nome" name="nome" value="{{ usuario[1] }}"  required>

        <label>Email</label>
        <input type="email" id="email" name="email" value="{{ usuario[2] }}"  required>

        <label>Senha</label>
        <input type="text" id="senha" name="senha" value="{{ usuario[3] }}"  required>


          <button type="submit" class="bnt">Salvar</button>



    </form>


</body>
</html>
